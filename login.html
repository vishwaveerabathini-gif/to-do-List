<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Consistency Tracker</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: "Poppins", sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #6a11cb,
                    #b7bfcc
                );

            overflow: hidden;

            color: white;
        }


        /* ================================
           HEADER
        ================================= */

        .brand-header {

            position: absolute;

            top: 25px;

            width: 100%;

            text-align: center;

            z-index: 5;
        }


        .main-title {

            font-size: 42px;

            font-weight: 900;

            margin: 0;

            background:
                linear-gradient(
                    135deg,
                    #ffeeb9,
                    #ff8ad6
                );

            -webkit-background-clip: text;

            background-clip: text;

            -webkit-text-fill-color: transparent;

            text-shadow:
                0 4px 12px
                rgba(0,0,0,.25);
        }


        .logo-icon {

            width: 42px;

            height: 42px;

            margin-right: 8px;

            vertical-align: middle;
        }


        .slogan {

            margin-top: 12px;

            font-size: 17px;

            color:
                rgba(255,255,255,.92);
        }


        /* ================================
           LOGIN CARD
        ================================= */

        .login-card {

            position: relative;

            z-index: 10;

            width: 360px;

            padding: 32px;

            margin-top: 130px;

            text-align: center;

            background:
                rgba(255,255,255,.15);

            backdrop-filter:
                blur(18px);

            border-radius: 22px;

            box-shadow:
                0 12px 35px
                rgba(0,0,0,.3);
        }


        .login-card h2 {

            margin-bottom: 6px;

            font-size: 24px;
        }


        .sub {

            margin-top: 0;

            margin-bottom: 18px;

            font-size: 14px;

            opacity: .9;
        }


        /* ================================
           INPUT
        ================================= */

        input {

            width: 100%;

            padding: 12px 16px;

            margin: 7px 0;

            border: none;

            border-radius: 999px;

            font-size: 15px;

            outline: none;

            background: white;

            color: #222;
        }


        input:focus {

            box-shadow:
                0 0 0 3px
                rgba(255,255,255,.25);
        }


        /* ================================
           BUTTONS
        ================================= */

        .login-btn {

            width: 100%;

            padding: 12px;

            margin-top: 10px;

            border-radius: 999px;

            border: none;

            cursor: pointer;

            font-weight: 700;

            font-size: 15px;

            transition: .2s;
        }


        .login-btn:hover {

            transform:
                translateY(-2px);
        }


        .login-btn:disabled {

            opacity: .65;

            cursor: not-allowed;

            transform: none;
        }


        .primary {

            background: white;

            color: #222;
        }


        .secondary {

            background: #000;

            color: white;

            border:
                1px solid white;
        }


        /* ================================
           FORGOT
        ================================= */

        .link-text {

            margin-top: 14px;

            font-size: 13px;

            opacity: .95;
        }


        .forgot-link {

            cursor: pointer;

            color: white;

            text-decoration: none;
        }


        .forgot-link:hover {

            text-decoration: underline;
        }


        /* ================================
           MESSAGE
        ================================= */

        .message-box {

            width: 100%;

            margin-top: 16px;

            padding: 11px 14px;

            border-radius: 12px;

            font-size: 13px;

            font-weight: 600;

            line-height: 1.4;

            text-align: left;

            display: none;
        }


        .message-box.show {

            display: block;
        }


        .message-box.success {

            background:
                rgba(22,199,132,.18);

            border:
                1px solid
                rgba(22,199,132,.55);

            color:
                #d8ffed;
        }


        .message-box.error {

            background:
                rgba(255,59,48,.18);

            border:
                1px solid
                rgba(255,59,48,.55);

            color:
                #ffe0dd;
        }


        .message-box.warning {

            background:
                rgba(255,184,0,.18);

            border:
                1px solid
                rgba(255,184,0,.55);

            color:
                #fff0bd;
        }


        /* ================================
           SPINNER
        ================================= */

        .spinner {

            display: inline-block;

            width: 14px;

            height: 14px;

            margin-right: 7px;

            border:
                2px solid
                rgba(0,0,0,.2);

            border-top-color:
                #222;

            border-radius: 50%;

            animation:
                spin .7s linear infinite;

            vertical-align: -2px;
        }


        .spinner.white {

            border:
                2px solid
                rgba(255,255,255,.3);

            border-top-color:
                white;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        /* ================================
           BACKGROUND
        ================================= */

        .bg-shape {

            position: absolute;

            width: 420px;

            height: 420px;

            filter:
                blur(120px);

            border-radius: 50%;

            opacity: .45;

            z-index: 0;
        }


        .bg-shape.one {

            background: #ff99cc;

            top: -120px;

            left: -160px;
        }


        .bg-shape.two {

            background: #7a70ff;

            bottom: -150px;

            right: -160px;
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width:500px) {

            .main-title {

                font-size: 30px;
            }


            .logo-icon {

                width: 32px;

                height: 32px;
            }


            .login-card {

                width:
                    calc(100% - 30px);

                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- ================================
         BRAND
    ================================= -->

    <div class="brand-header">

        <h1 class="main-title">

            <img
                class="logo-icon"
                src="https://cdn-icons-png.flaticon.com/512/4825/4825465.png"
                alt="Consistency Tracker"
            >

            Consistency Tracker

        </h1>


        <p class="slogan">

            Build Habits. Stay Consistent.

        </p>

    </div>



    <!-- ================================
         LOGIN CARD
    ================================= -->

    <div class="login-card">

        <h2>
            Welcome
        </h2>


        <p class="sub">
            Login to continue
        </p>


        <input
            id="auth-email"
            type="email"
            placeholder="Email"
            autocomplete="email"
        >


        <input
            id="auth-pass"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >


        <button
            id="btn-signin"
            class="login-btn primary"
        >

            Sign In

        </button>


        <button
            id="btn-signup"
            class="login-btn secondary"
        >

            Create Account

        </button>


        <p class="link-text">

            <a
                id="forgotLink"
                class="forgot-link"
            >

                Forgot password?

            </a>

        </p>


        <div
            id="messageBox"
            class="message-box"
        ></div>

    </div>



    <div class="bg-shape one"></div>

    <div class="bg-shape two"></div>



    <script>


        // ==========================================
        // ELEMENTS
        // ==========================================

        const emailInput =
            document.getElementById(
                "auth-email"
            );


        const passInput =
            document.getElementById(
                "auth-pass"
            );


        const btnSignin =
            document.getElementById(
                "btn-signin"
            );


        const btnSignup =
            document.getElementById(
                "btn-signup"
            );


        const messageBox =
            document.getElementById(
                "messageBox"
            );


        const forgotLink =
            document.getElementById(
                "forgotLink"
            );



        // ==========================================
        // MESSAGE
        // ==========================================

        function showMessage(
            message,
            type
        ) {

            messageBox.className =
                "message-box " +
                type +
                " show";


            messageBox.textContent =
                message;
        }


        function clearMessage() {

            messageBox.className =
                "message-box";


            messageBox.textContent =
                "";
        }



        // ==========================================
        // RESET BUTTONS
        // ==========================================

        function resetButtons() {

            btnSignin.disabled =
                false;


            btnSignup.disabled =
                false;


            btnSignin.innerHTML =
                "Sign In";


            btnSignup.innerHTML =
                "Create Account";
        }



        // ==========================================
        // LOGIN
        // ==========================================

        btnSignin.addEventListener(
            "click",
            async function () {

                clearMessage();


                const email =
                    emailInput.value.trim();


                const password =
                    passInput.value;


                if (!email) {

                    showMessage(
                        "Please enter your email address.",
                        "warning"
                    );

                    emailInput.focus();

                    return;
                }


                if (!password) {

                    showMessage(
                        "Please enter your password.",
                        "warning"
                    );

                    passInput.focus();

                    return;
                }


                btnSignin.disabled =
                    true;


                btnSignup.disabled =
                    true;


                btnSignin.innerHTML =

                    `<span class="spinner"></span>
                     Signing in...`;


                try {

                    const response =
                        await fetch(
                            "/login",
                            {

                                method:
                                    "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        email:
                                            email,

                                        password:
                                            password

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        showMessage(

                            data.error ||
                            "Invalid email or password.",

                            "error"

                        );


                        resetButtons();

                        return;
                    }


                    // Save logged-in user

                    localStorage.setItem(

                        "currentUser",

                        JSON.stringify(
                            data.user
                        )

                    );


                    /*
                     * IMPORTANT:
                     * replace() is NOT used here.
                     *
                     * We use normal location.href
                     * so browser Back can return
                     * to this login page.
                     */

                    window.location.href =
                        "index.html";

                }


                catch (error) {

                    console.error(
                        "Login Error:",
                        error
                    );


                    showMessage(

                        "Unable to connect to the server. Please make sure the backend is running.",

                        "error"

                    );


                    resetButtons();
                }

            }
        );



        // ==========================================
        // SIGNUP
        // ==========================================

        btnSignup.addEventListener(
            "click",
            async function () {

                clearMessage();


                const email =
                    emailInput.value.trim();


                const password =
                    passInput.value;


                if (!email) {

                    showMessage(
                        "Please enter your email address.",
                        "warning"
                    );

                    emailInput.focus();

                    return;
                }


                if (!password) {

                    showMessage(
                        "Please enter a password.",
                        "warning"
                    );

                    passInput.focus();

                    return;
                }


                if (
                    password.length < 6
                ) {

                    showMessage(
                        "Password must contain at least 6 characters.",
                        "warning"
                    );

                    passInput.focus();

                    return;
                }


                btnSignin.disabled =
                    true;


                btnSignup.disabled =
                    true;


                btnSignup.innerHTML =

                    `<span class="spinner white"></span>
                     Creating...`;


                try {

                    const response =
                        await fetch(
                            "/signup",
                            {

                                method:
                                    "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        email:
                                            email,

                                        password:
                                            password

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        showMessage(

                            data.error ||
                            "Unable to create your account.",

                            "error"

                        );


                        resetButtons();

                        return;
                    }


                    showMessage(

                        "Account created successfully. You can now sign in.",

                        "success"

                    );


                    passInput.value =
                        "";


                    resetButtons();

                    emailInput.focus();

                }


                catch (error) {

                    console.error(
                        "Signup Error:",
                        error
                    );


                    showMessage(

                        "Unable to connect to the server. Please make sure the backend is running.",

                        "error"

                    );


                    resetButtons();
                }

            }
        );



        // ==========================================
        // FORGOT PASSWORD
        // ==========================================

        forgotLink.addEventListener(
            "click",
            function () {

                showMessage(

                    "Password recovery is not available yet. Please contact the administrator.",

                    "warning"

                );

            }
        );



        // ==========================================
        // CLEAR MESSAGE
        // ==========================================

        emailInput.addEventListener(
            "input",
            clearMessage
        );


        passInput.addEventListener(
            "input",
            clearMessage
        );



        // ==========================================
        // ENTER KEY
        // ==========================================

        passInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    btnSignin.click();

                }

            }
        );



        // ==========================================
        // WHEN LOGIN PAGE COMES BACK
        // ==========================================

        window.addEventListener(
            "pageshow",
            function () {

                resetButtons();

                clearMessage();

            }
        );


    </script>


</body>

</html>
